<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gig Invoices</title>
  <meta name="description" content="Draft a gig invoice in your Gmail from your phone">
  <meta name="theme-color" content="#f4f1f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151217" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Invoices">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-side"><a id="back" class="link" href="#/" hidden>‹ Back</a></div>
    <h1 id="title">New invoice</h1>
    <div class="topbar-side right"><a id="settings-link" class="link" href="#/settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" class="gear" aria-hidden="true"><circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
    </a></div>
  </header>
  <main id="view"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bar">
      <button type="button" class="link" id="sheet-close">Close</button>
      <strong id="sheet-title">Preview</strong>
      <span></span>
    </div>
    <iframe id="sheet-frame" title="Invoice preview" sandbox></iframe>
  </div>
  <script src="build.js"></script>
  <script src="app.js"></script>
</body>
</html>
