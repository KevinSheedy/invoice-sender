<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gig Invoices</title>
  <meta name="description" content="Draft a gig invoice in your Gmail from your phone">
  <meta name="theme-color" content="#f4f1f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151217" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Invoices">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-side">
      <a id="back" class="link" href="#/" hidden>‹ Back</a>
      <button id="refresh" class="icon-btn" type="button" aria-label="Check for updates">
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.34-5.66"/>
          <path d="M20 3.5V9h-5.5"/>
        </svg>
      </button>
    </div>
    <h1 id="title">New invoice</h1>
    <div class="topbar-side right"><a id="settings-link" class="icon-btn" href="#/settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M9.53 1.69 L14.47 1.69 L15.18 4.66 L14.94 4.56 L17.54 2.96 L21.04 6.46 L19.44 9.06 L19.34 8.82 L22.31 9.53 L22.31 14.47 L19.34 15.18 L19.44 14.94 L21.04 17.54 L17.54 21.04 L14.94 19.44 L15.18 19.34 L14.47 22.31 L9.53 22.31 L8.82 19.34 L9.06 19.44 L6.46 21.04 L2.96 17.54 L4.56 14.94 L4.66 15.18 L1.69 14.47 L1.69 9.53 L4.66 8.82 L4.56 9.06 L2.96 6.46 L6.46 2.96 L9.06 4.56 L8.82 4.66 Z"/>
      </svg>
    </a></div>
  </header>
  <main id="view"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bar">
      <button type="button" class="link" id="sheet-close">Close</button>
      <strong id="sheet-title">Preview</strong>
      <span></span>
    </div>
    <iframe id="sheet-frame" title="Invoice preview" sandbox></iframe>
  </div>
  <script src="build.js"></script>
  <script src="app.js"></script>
</body>
</html>
